<div class="pagina" [style.--color-entorno]="color">
  <header class="cabecera">
    <h1>{{ titulo }}</h1>
    <p class="bienvenida">{{ bienvenida }}</p>
  </header>

  <section class="entorno">
    <span class="insignia">{{ siglas }}</span>
    <h2>{{ mensaje }}</h2>
    <p>Estás visualizando la versión <strong>{{ siglas }}</strong> de la aplicación.</p>
  </section>
</div>
